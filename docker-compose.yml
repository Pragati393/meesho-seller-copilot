services:
  backend:
    build:
      context: ./backend
    container_name: meesho-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # The browser (not the container) calls the API, so use a host-reachable URL.
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    container_name: meesho-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
